{% extends 'base.html' %}
{% block title %}Rate Donation{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h4 class="text-success mb-3">Rate "{{ req.donation.food_name }}"</h4>
                <p class="text-muted">How was your experience with donor <strong>{{ req.donation.donor.username }}</strong>?</p>
                <form method="POST">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success w-100">Submit Rating</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
